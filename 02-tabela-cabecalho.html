<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 02 tabela-cabecalho</title>
</head>
<style>
    th, td {
        border:1px solid blueviolet;
        padding: 6px 12px;
    }
    th {
        background: white;
    }
</style>
<body>
    
    <h1>Boletim</h1>
    <table border="1>"
    <table>
        <tr>
            <th scope="col">Aluno</th>
            <th scope="col">Nota</th>
            <th scope="col">Faltas</th>
        </tr>
        <tr>
            <th scope="row">Ana</th>
            <td>9,5</td>
            <td>2</td>
        </tr>
        <tr>
            <td>Bruno</td>
            <td>7,5</td>
            <td>5</td>
        </tr>
    </table>
</body>
</html>
